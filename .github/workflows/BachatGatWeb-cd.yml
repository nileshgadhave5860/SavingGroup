name: BachatGatWeb CD

on:
  workflow_dispatch:

concurrency: BachatGatWeb-cd

# Secrets:   SSH_HOST, SSH_USER (root), SSH_PASSWORD (or SSH_KEY = private key), SSH_PORT (optional, default 22)
# Variables: REACT_APP_API_BASE_URL (optional, Dockerfile default used if unset), UI_HOST_PORT (optional, default 8080)
# Server folder /var/www/Production/BachatGatWeb receives bachatgat-ui.tar. Host nginx should proxy to 127.0.0.1:<UI_HOST_PORT>.
env:
  IMAGE: bachatgat-ui
  DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH || '/var/www/Production/BachatGatWeb' }}
  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
  SSHPASS: ${{ secrets.SSH_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Build image and export .tar
        run: |
          ARGS=""
          if [ -n "${{ vars.REACT_APP_API_BASE_URL }}" ]; then ARGS="--build-arg REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL }}"; fi
          docker build $ARGS -t $IMAGE:latest bachatgatui
          docker save $IMAGE:latest -o $IMAGE.tar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p $SSH_PORT "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          if [ -n "${{ secrets.SSH_KEY }}" ]; then
            echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            echo "SSH_CMD=ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT" >> $GITHUB_ENV
            echo "SCP_CMD=scp -i $HOME/.ssh/id_deploy -P $SSH_PORT" >> $GITHUB_ENV
          else
            sudo apt-get install -y sshpass
            echo "SSH_CMD=sshpass -e ssh -p $SSH_PORT" >> $GITHUB_ENV
            echo "SCP_CMD=sshpass -e scp -P $SSH_PORT" >> $GITHUB_ENV
          fi

      - name: Upload .tar and restart container
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          HOST_PORT: ${{ vars.UI_HOST_PORT || '8080' }}
        run: |
          $SSH_CMD $TARGET "mkdir -p $DEPLOY_PATH"
          $SCP_CMD $IMAGE.tar $TARGET:$DEPLOY_PATH/$IMAGE.tar
          $SSH_CMD $TARGET "cd $DEPLOY_PATH && docker load -i $IMAGE.tar && docker rm -f $IMAGE 2>/dev/null || true && docker run -d --name $IMAGE --restart unless-stopped -p 127.0.0.1:$HOST_PORT:80 $IMAGE:latest && docker image prune -f"
